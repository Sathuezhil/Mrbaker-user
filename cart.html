<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - MR Baker</title>
    <link rel="stylesheet" href="styles/cart.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo mr-baker-logo">
                <span class="logo-text">MR. BAKER</span>
            </div>
            <div class="nav-right">
                <button class="back-btn" id="backBtn">← Back to Products</button>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="cart-content">
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be loaded here -->
            </div>

            <div class="cart-summary">
                <div class="summary-card">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (5%):</span>
                        <span id="tax">₹0</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">₹0</span>
                    </div>
                <div class="payment-section">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod">
                        <option value="">Select payment method</option>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Wallet">Wallet</option>
                        <option value="Stripe Card">Stripe Card</option>
                    </select>
                    
                    <!-- Stripe Card Form (shown when Stripe Card is selected) -->
                    <div id="stripeCardForm" class="stripe-card-form" style="display: none;">
                        <div class="stripe-field-group">
                            <label for="cardNumber">Card Number</label>
                            <div id="stripeCardNumber" class="stripe-card-element">
                                <!-- Stripe Elements will create card number input here -->
                            </div>
                        </div>
                        <div class="stripe-field-row">
                            <div class="stripe-field-group">
                                <label for="cardExpiry">Expiry Date (MM/YY)</label>
                                <div id="stripeCardExpiry" class="stripe-card-element">
                                    <!-- Stripe Elements will create expiry input here -->
                                </div>
                            </div>
                            <div class="stripe-field-group">
                                <label for="cardCvc">CVV</label>
                                <div id="stripeCardCvc" class="stripe-card-element">
                                    <!-- Stripe Elements will create CVV input here -->
                                </div>
                            </div>
                        </div>
                        <div id="stripeCardErrors" class="stripe-card-errors" role="alert"></div>
                        <button type="button" id="addCardBtn" class="add-card-btn">Add Card</button>
                    </div>
                </div>
                    
                    <button class="purchase-btn" id="purchaseBtn">Purchase & Print Bill</button>
                    <button class="clear-btn" id="clearBtn">Clear Cart</button>
                </div>
            </div>
        </div>

        <div id="billSection" class="bill-section" style="display: none;">
            <div class="bill" id="billContent">
                <!-- Bill content will be generated here -->
            </div>
        </div>
    </div>

    <!-- Bill Preview Modal -->
    <div id="billModal" class="bill-modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Invoice Preview</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBillContent">
                <!-- Bill preview will be shown here -->
            </div>
            <div class="modal-footer">
                <button class="print-btn" id="printBillBtn">🖨️ Print Bill</button>
                <button class="cancel-btn" id="cancelBillBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="scripts/cart.js"></script>
</body>
</html>
