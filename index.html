<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MR Baker</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="mr-baker-logo">
                    <span class="logo-text">MR. BAKER</span>
                </div>
                <p>Welcome Back!</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username / Email / Phone</label>
                    <input type="text" id="username" name="username" required autocomplete="off" placeholder="Enter username, email, or phone">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <p class="register-link">Don't have an account? <a href="#" id="registerLink">Register</a></p>
            </form>
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>
    <script src="scripts/login.js"></script>
</body>
</html>
